name: Market fusion research gate

on:
  pull_request:
    paths:
      - 'site/market-fusion.mjs'
      - 'site/market-joint-shadow.mjs'
      - 'site/turnout-sensitivity.mjs'
      - 'site/turnout-ui.mjs'
      - 'site/precinct-turnout-ui.mjs'
      - 'scripts/build_turnout_district_panel.py'
      - 'site/turnout-district-panel.mjs'
      - 'site/turnout-association-ui.mjs'
      - 'site/turnout-shadow-ui.mjs'
      - 'scripts/evaluate_turnout_shadows.py'
      - 'site/turnout-two-cycle-ui.mjs'
      - 'site/turnout-three-year-ui.mjs'
      - 'scripts/audit_turnout_three_year.py'
      - 'tests/test_turnout_three_year.py'
      - 'tests/turnout-three-year-ui.mjs'
      - 'scripts/build_turnout_2014_2018.py'
      - 'scripts/evaluate_turnout_county_cycles.py'
      - 'scripts/evaluate_turnout_two_cycle_towns.py'
      - 'tests/test_turnout_2014_2018.py'
      - 'tests/test_turnout_county_cycles.py'
      - 'tests/test_turnout_two_cycle_towns.py'
      - 'tests/turnout-two-cycle-ui.mjs'
      - 'tests/test_turnout_shadows.py'
      - 'tests/turnout-shadow-ui.mjs'
      - 'scripts/build_cec_candidate_turnout_panel.py'
      - 'scripts/evaluate_turnout_holdout.py'
      - 'tests/turnout-association-ui.mjs'
      - 'tests/test_cec_town_candidate_panel.py'
      - 'tests/test_turnout_holdout.py'
      - 'tests/turnout-district-panel.mjs'
      - 'tests/test_turnout_district_panel.py'
      - 'scripts/import_cec_open_csv.py'
      - 'scripts/import_cec_precincts.py'
      - 'site/turnout.css'
      - 'data/turnout-history-2018-2022.json'
      - 'site/market-observatory.mjs'
      - 'site/candidate-app.mjs'
      - 'scripts/archive_market_fusion.mjs'
      - 'scripts/evaluate_market_fusion.mjs'
      - 'tests/market-fusion.mjs'
      - 'tests/market-joint-shadow.mjs'
      - 'tests/turnout-sensitivity.mjs'
      - 'tests/precinct-turnout.mjs'
      - 'tests/test_cec_precinct_import.py'
      - 'tests/test_cec_open_csv.py'
      - 'tests/market-fusion-evidence.mjs'
      - 'tests/market-observatory.mjs'
      - '.github/workflows/market-fusion-tests.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source modules
        run: |
          node --check site/market-fusion.mjs
          node --check site/market-joint-shadow.mjs
          node --check site/turnout-sensitivity.mjs
          node --check site/turnout-ui.mjs
          node --check site/precinct-turnout-ui.mjs
          node --check site/turnout-district-panel.mjs
          node --check site/turnout-association-ui.mjs
          node --check site/turnout-shadow-ui.mjs
          node --check site/turnout-two-cycle-ui.mjs
          node --check site/market-observatory.mjs
          node --check site/candidate-app.mjs
          node --check scripts/archive_market_fusion.mjs
          node --check scripts/evaluate_market_fusion.mjs
      - name: Test invariant event-fusion weights
        run: node tests/market-fusion.mjs
      - name: Test market observation presentation
        run: node tests/market-observatory.mjs
      - name: Test joint correlated election simulations and ESS quality gates
        run: node tests/market-joint-shadow.mjs
      - name: Test synthetic original CSV and XLS polling-station accounting
        run: |
          python -m unittest tests.test_cec_open_csv -v
          python -m unittest tests.test_cec_precinct_import -v
      - name: Test precinct-level history browser and county total conservation
        run: node tests/precinct-turnout.mjs
      - name: Test township comparison rendering and no-causal-claim guards
        run: node tests/turnout-district-panel.mjs
      - name: Test vote-source conservation and time-ordered holdout
        run: |
          python -m unittest tests.test_cec_town_candidate_panel -v
          python -m unittest tests.test_turnout_holdout -v
          python scripts/evaluate_turnout_holdout.py --output /tmp/holdout-without-future-candidates.json
          node tests/turnout-association-ui.mjs
      - name: Test frozen shadow turnout forecasts and paired geographic uncertainty
        run: |
          python -m unittest tests.test_turnout_shadows -v
          python scripts/evaluate_turnout_shadows.py --output /tmp/turnout-shadow-ablation-2022.json
          node tests/turnout-shadow-ui.mjs
      - name: Test original 2014 CEC labels and independently held-out 2018 / 2022 cycles
        run: |
          python -m unittest tests.test_turnout_2014_2018 -v
          python -m unittest tests.test_turnout_county_cycles -v
          python -m unittest tests.test_turnout_two_cycle_towns -v
          python scripts/evaluate_turnout_county_cycles.py --output /tmp/cec-county-two-cycle.json
          node tests/turnout-two-cycle-ui.mjs && node tests/turnout-three-year-ui.mjs
          python -m unittest tests.test_turnout_three_year -v
          python scripts/audit_turnout_three_year.py --output /tmp/turnout-three-year-compatibility.json
      - name: Test historical township source reconciliation
        run: |
          python -m unittest tests.test_turnout_district_panel -v
          python scripts/build_turnout_district_panel.py --output /tmp/town-turnout-panel.json
      - name: Test CEC turnout data and neutral mathematical sensitivity bounds
        run: node tests/turnout-sensitivity.mjs
      - name: Test aligned archive and synthetic future-outcome evaluation
        run: node tests/market-fusion-evidence.mjs
