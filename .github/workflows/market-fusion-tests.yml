name: Market fusion research gate

on:
  pull_request:
    paths:
      - 'site/market-fusion.mjs'
      - 'site/market-joint-shadow.mjs'
      - 'site/turnout-sensitivity.mjs'
      - 'site/turnout-ui.mjs'
      - 'site/precinct-turnout-ui.mjs'
      - 'scripts/build_turnout_district_panel.py'
      - 'tests/test_turnout_district_panel.py'
      - 'scripts/import_cec_open_csv.py'
      - 'scripts/import_cec_precincts.py'
      - 'site/turnout.css'
      - 'data/turnout-history-2018-2022.json'
      - 'site/market-observatory.mjs'
      - 'site/candidate-app.mjs'
      - 'scripts/archive_market_fusion.mjs'
      - 'scripts/evaluate_market_fusion.mjs'
      - 'tests/market-fusion.mjs'
      - 'tests/market-joint-shadow.mjs'
      - 'tests/turnout-sensitivity.mjs'
      - 'tests/precinct-turnout.mjs'
      - 'tests/test_cec_precinct_import.py'
      - 'tests/test_cec_open_csv.py'
      - 'tests/market-fusion-evidence.mjs'
      - 'tests/market-observatory.mjs'
      - '.github/workflows/market-fusion-tests.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source modules
        run: |
          node --check site/market-fusion.mjs
          node --check site/market-joint-shadow.mjs
          node --check site/turnout-sensitivity.mjs
          node --check site/turnout-ui.mjs
          node --check site/precinct-turnout-ui.mjs
          node --check site/market-observatory.mjs
          node --check site/candidate-app.mjs
          node --check scripts/archive_market_fusion.mjs
          node --check scripts/evaluate_market_fusion.mjs
      - name: Test invariant event-fusion weights
        run: node tests/market-fusion.mjs
      - name: Test market observation presentation
        run: node tests/market-observatory.mjs
      - name: Test joint correlated election simulations and ESS quality gates
        run: node tests/market-joint-shadow.mjs
      - name: Test synthetic original CSV and XLS polling-station accounting
        run: |
          python -m unittest tests.test_cec_open_csv -v
          python -m unittest tests.test_cec_precinct_import -v
      - name: Test precinct-level history browser and county total conservation
        run: node tests/precinct-turnout.mjs
      - name: Test historical township source reconciliation
        run: |
          python -m unittest tests.test_turnout_district_panel -v
          python scripts/build_turnout_district_panel.py --output /tmp/town-turnout-panel.json
      - name: Test CEC turnout data and neutral mathematical sensitivity bounds
        run: node tests/turnout-sensitivity.mjs
      - name: Test aligned archive and synthetic future-outcome evaluation
        run: node tests/market-fusion-evidence.mjs
