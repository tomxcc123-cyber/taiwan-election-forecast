name: HB-TLEF v4.1 compatibility tests

on:
  pull_request:
    paths:
      - 'model/fragmentation_live.py'
      - 'model/v41_product.py'
      - 'model/releases/v4.1-public-beta.2.json'
      - 'tests/test_fragmentation_live.py'
      - 'scripts/validate_fragmentation_poll_gate*.py'
      - 'scripts/audit_v41_public_beta_release.py'
      - '.github/workflows/v41-release-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full offline unit suite
        run: python -m unittest discover -s tests -v
      - name: Reproduce fragmentation v1
        env:
          PYTHONPATH: .
        run: python scripts/validate_fragmentation_poll_gate.py
      - name: Reproduce fragmentation v2
        env:
          PYTHONPATH: .
        run: python scripts/validate_fragmentation_poll_gate_v2.py
      - name: Reproduce fragmentation v3
        env:
          PYTHONPATH: .
        run: python scripts/validate_fragmentation_poll_gate_v3.py
      - name: Reproduce selective RC3 reference
        env:
          PYTHONPATH: .
        run: python scripts/validate_release_candidate_v3.py
      - name: Audit frozen v4.1 manifest
        env:
          PYTHONPATH: .
        run: python scripts/audit_v41_public_beta_release.py
      - name: Build v4.1 compatibility product directly
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from model.v41_product import build_product
          root=Path('.')
          feed=json.loads((root/'data/polls.json').read_text(encoding='utf-8'))
          now=datetime.fromisoformat(feed['checked_at'])
          data=build_product(root,now,feed)
          assert data['model_id']=='HB-TLEF-v4.1-public-beta.2'
          assert data['release']['public_beta'] is True
          assert data['release']['stable'] is False
          assert len(data['counties'])==22
          assert 'fragmentation_gate' in data
          print(data['model_id'], data['fragmentation_gate']['triggered_count'])
          PY
