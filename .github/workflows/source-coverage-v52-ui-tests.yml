name: Source coverage v5.2 UI tests

on:
  pull_request:
    paths:
      - 'site/poll-source-v52.mjs'
      - 'site/source-v52.css'
      - 'site/index.html'
      - 'tests/source-v52-ui.mjs'
      - '.github/workflows/source-coverage-v52-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Validate Source Coverage v5.2 pure UI logic
        run: node tests/source-v52-ui.mjs
      - name: Build exact public product
        env:
          PYTHONPATH: .
        run: python scripts/build.py
      - name: Validate existing browser artifacts
        run: |
          node tests/model.mjs
          node tests/candidate-engine.mjs
          node tests/evidence-ui.mjs
          node tests/scenario-studio.mjs
      - name: Assert observatory shipped
        run: |
          test -f dist/poll-source-v52.mjs
          test -f dist/source-v52.css
          grep -q 'poll-source-v52.mjs' dist/index.html
          grep -q 'source-v52.css' dist/index.html
          grep -q '民調來源觀測站' dist/poll-source-v52.mjs
