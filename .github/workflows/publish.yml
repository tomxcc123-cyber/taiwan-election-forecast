name: Update polls and publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'qa/**']
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: public-election-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test parsing and failure recovery
        run: python -m unittest discover -s tests -v
      - name: Fetch original reports
        run: python scripts/update_polls.py
      - name: Preserve last valid data and audit log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/polls.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified poll archive and source status"
            git push origin HEAD:main
          fi
      - name: Build publication artifact
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Report degraded sources
        run: |
          python -c "import json; d=json.load(open('data/polls.json')); print('Source status:',d['status']); print('Skipped/failed:',len(d['failures'])); print('Newest fieldwork:',d['latest_fieldwork_date'])"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
