name: Update polls and publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'qa/**']
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: public-election-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test parsing and failure recovery
        run: python -m unittest discover -s tests -v
      - name: Fetch original reports
        run: python scripts/update_polls.py
      - name: Merge reviewed fail-closed sources
        run: python scripts/enrich_reviewed_polls.py
      - name: Discover additional first-party poll pages
        run: python scripts/discover_poll_sources.py
      - name: Verify and promote complete-source vote-intention reports
        run: python scripts/promote_poll_sources.py
      - name: Fetch read-only Taiwan election market snapshots
        run: python scripts/update_market_snapshots.py
      - name: Reconstruct CEC historical polling-station archive from original bulk CSV
        run: |
          set -euo pipefail
          if [ ! -s data/cec-precincts/index.json ]; then
            echo "No verified archived CEC precinct data yet; downloading original official release."
            curl --fail --location --silent --show-error --max-time 150 --retry 1 \
              --output /tmp/cec-votedata.zip 'https://data.cec.gov.tw/選舉資料庫/votedata.zip'
            python scripts/import_cec_open_csv.py \
              --zip /tmp/cec-votedata.zip \
              --history data/candidate-history-cec.json \
              --output data/cec-precincts
            rm -f /tmp/cec-votedata.zip
          else
            echo "Using previously reconciled, immutable CEC precinct chunks."
          fi
      - name: Build CEC matched-township historical turnout panel
        run: python scripts/build_turnout_district_panel.py
      - name: Audit CEC candidate votes and run 2022 time-ordered turnout holdout
        run: |
          set -euo pipefail
          if [ ! -s data/cec-town-candidate-association-2018-2022.json ]; then
            curl --fail --location --silent --show-error --max-time 150 --retry 1 \
              --output /tmp/cec-candidate-votes.zip 'https://data.cec.gov.tw/選舉資料庫/votedata.zip'
            python scripts/build_cec_candidate_turnout_panel.py \
              --zip /tmp/cec-candidate-votes.zip \
              --output data/cec-town-candidate-association-2018-2022.json
            rm -f /tmp/cec-candidate-votes.zip
          else
            echo "Reusing archived, independently reconciled historical candidate votes."
          fi
          python scripts/evaluate_turnout_holdout.py \
            --association data/cec-town-candidate-association-2018-2022.json \
            --output data/turnout-holdout-2018-2022.json
      - name: Evaluate frozen 2018-only turnout shadow formulas on 2022
        run: python scripts/evaluate_turnout_shadows.py
      - name: Restore independently matched 2014 and 2018 township turnout from original CEC
        run: |
          set -euo pipefail
          if [ ! -s data/turnout-district-panel-2014-2018.json ]; then
            curl --fail --location --silent --show-error --max-time 150 --retry 1 \
              --output /tmp/cec-2014-admin.zip 'https://data.cec.gov.tw/選舉資料庫/votedata.zip'
            python scripts/build_turnout_2014_2018.py \
              --zip /tmp/cec-2014-admin.zip \
              --source data/cec-precincts \
              --history data/candidate-history-cec.json \
              --output data/turnout-district-panel-2014-2018.json
            rm -f /tmp/cec-2014-admin.zip
          else
            echo "Using source-audited 2014 elbase names and 2014–2018 station-to-district comparison."
          fi
      - name: Independently evaluate two historical county and township turnout cycles
        run: |
          set -euo pipefail
          python scripts/evaluate_turnout_county_cycles.py \
            --output data/turnout-county-two-cycle-2014-2022.json
          python scripts/evaluate_turnout_two_cycle_towns.py \
            --prior data/turnout-district-panel-2014-2018.json \
            --recent data/turnout-district-panel-2018-2022.json \
            --shadow data/turnout-shadow-ablation-2022.json \
            --output data/turnout-two-cycle-town-validation.json
      - name: Preserve last valid data and audit log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/polls.json data/market-snapshots.json data/cec-precincts data/turnout-district-panel-2018-2022.json data/cec-town-candidate-association-2018-2022.json data/turnout-holdout-2018-2022.json data/turnout-shadow-ablation-2022.json data/turnout-district-panel-2014-2018.json data/turnout-two-cycle-town-validation.json data/turnout-county-two-cycle-2014-2022.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified poll archive and source status"
            git push origin HEAD:main
          fi
      - name: Build publication artifact
        run: python scripts/build.py
      - name: Check market observer module syntax
        run: node --check site/market-observatory.mjs && node --check site/market-fusion.mjs && node --check site/market-joint-shadow.mjs && node --check site/turnout-sensitivity.mjs && node --check site/precinct-turnout-ui.mjs && node --check site/turnout-district-panel.mjs && node --check site/turnout-association-ui.mjs && node --check site/turnout-shadow-ui.mjs && node --check site/turnout-two-cycle-ui.mjs && node --check site/turnout-three-year-ui.mjs && node --check site/turnout-ui.mjs && node --check site/candidate-app.mjs && node --check scripts/archive_market_fusion.mjs && node --check scripts/evaluate_market_fusion.mjs && node tests/market-observatory.mjs && node tests/market-fusion.mjs && node tests/market-fusion-evidence.mjs && node tests/market-joint-shadow.mjs && node tests/turnout-sensitivity.mjs && node tests/precinct-turnout.mjs && node tests/turnout-district-panel.mjs && node tests/turnout-association-ui.mjs && node tests/turnout-shadow-ui.mjs && node tests/turnout-two-cycle-ui.mjs && node tests/turnout-three-year-ui.mjs
      - name: Validate reproducible forecast model
        run: |
          if [ -f dist/model-data.json ]; then node tests/model.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/candidate-engine.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/evidence-ui.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/scenario-studio.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/history-atlas.mjs; fi
      - name: Preserve aligned daily model, market and baseline histories
        run: |
          python scripts/archive_forecast.py
          node scripts/archive_market_fusion.mjs
          if [ -f dist/candidate-model.json ]; then
            cp data/forecast-history.json dist/forecast-history.json
          fi
          git add data/forecast-history.json data/market-fusion-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive aligned election model and market research signals"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Report degraded sources
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/polls.json',encoding='utf-8'))
          reviewed=sum(1 for r in d['records'] if r.get('ingestion')=='reviewed_multi_source_methodology')
          print('Source status:',d['status'])
          print('Skipped/failed:',len(d['failures']))
          print('Reviewed seed records:',reviewed)
          print('Discovery queue:',len(d.get('discovery_queue',[])))
          print('Discovery checked:',d.get('discovery_checked_at'))
          print('Registered pollsters:',d.get('pollster_registry',{}).get('registered_pollsters'))
          print('Newest fieldwork:',d['latest_fieldwork_date'])
          PY

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
