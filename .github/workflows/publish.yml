name: Update polls and publish website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'qa/**']
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: public-election-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test parsing and failure recovery
        run: python -m unittest discover -s tests -v
      - name: Fetch original reports
        run: python scripts/update_polls.py
      - name: Merge reviewed fail-closed sources
        run: python scripts/enrich_reviewed_polls.py
      - name: Preserve last valid data and audit log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/polls.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified poll archive and source status"
            git push origin HEAD:main
          fi
      - name: Build publication artifact
        run: python scripts/build.py
      - name: Validate reproducible forecast model
        run: |
          if [ -f dist/model-data.json ]; then node tests/model.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/candidate-engine.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/evidence-ui.mjs; fi
          if [ -f dist/candidate-model.json ]; then node tests/scenario-studio.mjs; fi
      - name: Preserve daily baseline and version history
        run: |
          python scripts/archive_forecast.py
          if [ -f data/forecast-history.json ]; then
            git add data/forecast-history.json
            if ! git diff --cached --quiet; then
              git commit -m "Archive daily forecast baseline"
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Report degraded sources
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/polls.json',encoding='utf-8'))
          reviewed=sum(1 for r in d['records'] if r.get('ingestion')=='reviewed_multi_source_methodology')
          print('Source status:',d['status'])
          print('Skipped/failed:',len(d['failures']))
          print('Reviewed seed records:',reviewed)
          print('Newest fieldwork:',d['latest_fieldwork_date'])
          PY

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
